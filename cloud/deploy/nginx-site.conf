# Install as /etc/nginx/sites-available/YOUR_DOMAIN  (then symlink into sites-enabled).
# Replace YOUR_DOMAIN with your DuckDNS name. Run certbot afterwards; it adds the 443 block.
# This file is separate from any other nginx site on the machine and does not touch it.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 64k;
    limit_req zone=cn_zone burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite (not append) so clients cannot spoof their IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP uses streaming responses and ask_me can wait for minutes
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}
