[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-notifier"
version = "0.1.0"
description = "MCP server, hooks and CLI that notify you on Telegram, ntfy, Gmail or WhatsApp when your AI coding agent (Claude Code, Codex, OpenCode) finishes."
readme = "README.md"
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "notifications", "telegram", "claude-code", "codex", "opencode", "ai-agents", "ntfy"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
agent-notifier = "agent_notifier.cli:main"
agent-notifier-mcp = "agent_notifier.server:main"

[project.urls]
Homepage = "https://agent-notifiers.vercel.app/"
Repository = "https://github.com/wolfras/agent-notifier"
Issues = "https://github.com/wolfras/agent-notifier/issues"

[tool.setuptools]
packages = ["agent_notifier"]
