[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-notifiers"
version = "0.2.0"
description = "Agent Notifiers — paired AI agent CLI and notification companion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
agent-notifiers = "agent_notifier.cli:main"
agent-notifier = "agent_notifier.cli:main"
agent-notifiers-mcp = "agent_notifier.server:main"
agent-notifier-mcp = "agent_notifier.server:main"

[project.urls]
Homepage = "https://agentnotifier.duckdns.org/"
Repository = "https://github.com/wolfrax460/agent-notifier"

[tool.setuptools]
packages = ["agent_notifier"]
